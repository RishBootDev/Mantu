[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mantu-ml-services"
version = "0.1.0"
description = "FastAPI ML capabilities for the Mantu payment platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "structlog>=24.4",
  "py-eureka-client>=0.13,<1.0",
]

[project.optional-dependencies]
ml = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "shap>=0.46",
]
streaming = ["aiokafka>=0.11"]
kyc = [
  "opencv-python-headless>=4.10",
  "rapidfuzz>=3.9",
  "paddleocr>=2.8",
  "paddlepaddle>=2.6",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
